<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
  <div class="container d-flex justify-content-center align-items-center min-vh-100">
     

        <form class="w-50">
		<img class="mb-4" src="dvolt_logo1.png" alt="" width="200" height="57">
            <h1 class="h3 mb-3 fw-normal" data-dl-uid="1" data-dl-original="true" data-dl-translated="true">Войдите в систему</h1>
		<div class="mb-3">
		
            <div class="form-floating">
			<input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
			<label for="floatingInput" data-dl-uid="2" data-dl-original="true" data-dl-translated="true">Адрес электронной почты</label>
			</div>
            <div class="form-floating"> <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
			<label for="floatingPassword" data-dl-uid="3" data-dl-original="true" data-dl-translated="true">Пароль</label>
			</div>
            <div class="form-check text-start my-3">
			<input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault">
			<label class="form-check-label" for="checkDefault" data-dl-uid="4" data-dl-original="true" data-dl-translated="true">Запомнить меня</label>
			</div>
			<button class="btn btn-primary w-100 py-2" type="submit" data-dl-uid="5" data-dl-original="true" data-dl-translated="true">Войти</button>
            <p class="mt-5 mb-3 text-body-secondary" data-dl-uid="6" data-dl-original="true" data-dl-translated="true">© 2026</p>
			</div>
        </form>
		</div>
   
	
    <script src="/docs/5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" class="astro-vvvwv3sm"></script>
</body>
</html>
